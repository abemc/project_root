version: '3.8'

services:
  streamlit-ui:
    image: project_root_streamlit-ui:latest
    build: .
    # network_mode: host を廃止し、ポートフォワーディングに切り替え
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace  # ワーキングディレクトリに合わせて /workspace にマウント
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434  # ホスト側のOllamaを指すように変更
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    working_dir: /workspace
    # だんまり原因を特定する間は、無限再起動（always）を一時的に無効化（ログを残して止まらせる）
    restart: "no"