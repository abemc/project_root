user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Upstream backends
    upstream prod_backend {
        server app-prod:8501 max_fails=3 fail_timeout=30s;
    }

    upstream canary_backend {
        server app-canary:8501 max_fails=3 fail_timeout=30s;
    }

    # Split traffic: 95% prod, 5% canary
    split_clients $remote_addr $split_backend {
        5%   "canary_backend";
        95%  "prod_backend";
    }

    # Health check endpoint
    server {
        listen 80;
        server_name localhost;
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Main server with traffic split (95% prod, 5% canary)
    server {
        listen 80 default_server;
        server_name _;

        # Split traffic: 95% to prod, 5% to canary
        set $backend_pool $split_backend;
        if ($remote_addr ~ "^10\.0\.0\.[5-9]$|^10\.0\.0\.1[0-9]$") {
            set $backend_pool "canary_backend";
        }

        set $stage_name "prod";
        if ($backend_pool = "canary_backend") {
            set $stage_name "canary";
        }

        location / {
            proxy_pass http://$backend_pool;
            add_header X-Deployment-Stage $stage_name;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;

            proxy_connect_timeout 30s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        # Metrics endpoint
        location /metrics {
            proxy_pass http://prod_backend/metrics;
            access_log off;
        }
    }
}
